[package]
name = "opencode-config-studio"
version = "3.1.1"
description = "Desktop editor for OpenCode's opencode.json"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
opencode-cli = { git = "https://github.com/Kaan88/claude-switch.git", rev = "9a08478effc9ecfb38abd1b4b1ef6a6d5a1f49df" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "3"
tauri-plugin-single-instance = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
