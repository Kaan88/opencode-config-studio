<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OpenCode Config Studio</title><style>
:root{font-family:Segoe UI,system-ui,sans-serif;color:#e5eaf2;background:#101419;color-scheme:dark;--line:#303945;--muted:#9baabc;--accent:#b6e576}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:7px;background:#242d38;color:#e5eaf2;padding:9px 13px}button:hover{border-color:#81976e}button.primary{background:var(--accent);color:#17200d;border-color:var(--accent);font-weight:650}button.danger{color:#ffb7ad}button:disabled{opacity:.45;cursor:default}input,select,textarea{background:#10171e;color:#e5eaf2;border:1px solid #3b4857;border-radius:6px;padding:9px;max-width:100%;width:100%}input:focus,select:focus,textarea:focus{outline:2px solid #8ab755;outline-offset:1px}textarea{font:13px/1.6 Consolas,monospace;min-height:160px;resize:vertical}header{padding:22px 30px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:18px;background:#171e26;position:sticky;top:0;z-index:5}h1{font-size:20px;margin:0 0 5px}h2{font-size:27px;margin:0 0 8px}h3{font-size:18px;margin:0}p{line-height:1.6;color:var(--muted)}small,.muted{color:var(--muted);font-size:12px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.shell{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:calc(100vh - 92px)}aside{background:#151b22;padding:24px 16px;border-right:1px solid var(--line)}nav button{display:block;width:100%;text-align:left;margin-bottom:8px;background:transparent}.selected{background:#2b3841!important;border-color:#8daa6a!important}nav .provider{padding:14px 12px}nav .provider small{display:block;margin-top:6px;overflow-wrap:anywhere}.navlabel{font-size:11px;letter-spacing:1.5px;color:var(--muted);margin:22px 8px 12px;text-transform:uppercase}main{max-width:1200px;width:100%;padding:32px 38px}.card{border:1px solid var(--line);background:#1a222b;border-radius:12px;padding:22px;margin:20px 0}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:flex;flex-direction:column;gap:7px;margin:12px 0}.field>label{font-size:13px;color:#c9d3df}.row{display:flex;gap:8px;align-items:flex-start}.row>.grow{flex:1;min-width:0}.tiny{padding:6px 9px;font-size:12px}.badge{color:var(--accent);border:1px solid #526141;border-radius:20px;padding:3px 8px;font-size:11px}details{border:1px solid var(--line);border-radius:8px;margin:12px 0;padding:12px}summary{cursor:pointer;font-weight:600;font-size:14px;overflow-wrap:anywhere}.objectbody{padding:4px 4px 0 14px;border-left:1px solid #3b4957;margin-top:12px}.addrow{display:flex;gap:8px;margin:12px 0}.addrow select,.addrow input{flex:1}.notice{background:#212d23;border:1px solid #435c3d;padding:12px 16px;border-radius:8px;color:#cce1b8;line-height:1.6}.notice.error{background:#392723;border-color:#8b5044;color:#ffd1c6}#status{max-width:560px;font-size:12px;color:var(--accent)}#feedback:empty{display:none}#feedback{position:sticky;top:94px;z-index:4;white-space:pre-wrap;margin-bottom:18px}.modeltitle{overflow-wrap:anywhere;font-weight:600}.raw{min-height:65vh}.help{font-size:12px;line-height:1.55;color:var(--muted);margin:6px 0 14px}.pill{font-size:11px;color:var(--muted);margin-left:6px}dialog{background:#1a222b;color:#e5eaf2;border:1px solid #536171;border-radius:12px;max-width:620px;width:90%;padding:24px}dialog::backdrop{background:#0009}.full{grid-column:1/-1}a{color:var(--accent)}footer{margin:36px 0;color:var(--muted);font-size:12px}#dirty{font-size:12px;color:var(--accent)}.status{display:inline-block;margin:6px 0 0;font-size:12px}.status.up{color:var(--accent)}.status.down{color:#ffb7ad}h4{margin:18px 0 6px;font-size:13px;color:#c9d3df;text-transform:uppercase;letter-spacing:1px}.syncrow{margin:8px 0;align-items:center}.syncrow input{width:auto;flex:none;margin:0 4px 0 0}.syncrow span.grow{overflow-wrap:anywhere}.syncrow .pill{margin:0}dialog{max-height:86vh;overflow:auto}@media(max-width:850px){header{position:relative;flex-wrap:wrap;padding:18px}.shell{grid-template-columns:1fr}aside{border-right:0}nav{display:flex;flex-wrap:wrap;gap:6px}nav button{width:auto}main{padding:22px 18px}.grid{grid-template-columns:1fr}#feedback{top:8px}}
</style></head><body><header><div><h1>◈ OpenCode <span style="color:#b6e576">Config Studio</span></h1><small>One configuration · CLI + Desktop</small></div><div class="toolbar"><span id="dirty"></span><button id="revert">Reload file</button><button id="validate">Validate</button><button id="save" class="primary">Save configuration</button><button id="reload">Reload OpenCode</button></div></header><div class="shell"><aside><div class="navlabel">Workspace</div><nav id="globalnav"></nav><div class="navlabel">Backends</div><nav id="providers"></nav><button id="newprovider" style="width:100%">＋ Add backend</button><div class="navlabel">Configuration file</div><small id="filepath" style="overflow-wrap:anywhere;display:block;padding:0 8px"></small><p class="help" style="padding:8px">Saves create timestamped backups beside your JSON. Existing fields and JSONC comments are preserved.</p></aside><main><div id="feedback" role="status" aria-live="polite"></div><div id="content"></div><footer><span id="schemasource">Schema: loading…</span> · <a id="docs" href="https://opencode.ai/v2/docs/models">Model settings reference ↗</a></footer></main></div><dialog id="modal"><h3 id="dialogtitle"></h3><div id="dialogbody"></div><div id="dialogactions" class="toolbar" style="justify-content:flex-end;margin-top:20px"></div></dialog><script src="app.js"></script></body></html>
